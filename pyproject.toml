[project]
name = "clothing-designer"
version = "0.1.0"
description = "Claude designs garments; a local diffusion model renders them."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.9.0",
    "fal-client>=1.0.3",
    "fastapi>=0.163.1",
    "mflux>=0.24.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
clothing-designer = "clothing_designer:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
